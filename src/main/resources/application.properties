spring.application.name=bureaucracy-translator
server.port=8080

# Spring's own multipart default is 1MB, exactly our business limit.
# Raised here so our own validation (clear 400 message) is what rejects
# oversized images, not the servlet container silently.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
